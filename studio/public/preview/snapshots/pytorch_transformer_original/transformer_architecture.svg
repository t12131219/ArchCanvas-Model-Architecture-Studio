<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Original encoder-decoder Transformer architecture</title>
  <desc id="desc">Source-grounded Transformer architecture with source and target embeddings, encoder stack, decoder masked self-attention, cross-attention, feed-forward layers, and vocabulary projection.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#526078}
      .label{font-size:18px;font-weight:650}.small{font-size:14px;fill:#526078}.tiny{font-size:12px;fill:#526078}
      .box{stroke-width:2;rx:12}.edge{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="64" y="66" class="title">Transformer · Encoder–Decoder</text>
  <text x="64" y="96" class="sub">Source: transformer.py · explicit attention implementation, post-LayerNorm residual blocks</text>
  <rect x="1110" y="42" width="420" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1320" y="71" class="small" text-anchor="middle">Default: 6 encoder / 6 decoder · d_model 512</text>
  <text x="1320" y="94" class="tiny" text-anchor="middle">example.py overrides to 2 / 2 layers, d_model 128</text>

  <rect x="90" y="168" width="250" height="78" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="215" y="201" text-anchor="middle" class="label">Source token IDs</text><text x="215" y="226" text-anchor="middle" class="small">[B,S] · padding mask</text>
  <rect x="90" y="300" width="250" height="82" class="box" fill="#cffafe" stroke="#0891b2"/>
  <text x="215" y="334" text-anchor="middle" class="label">Token embedding</text><text x="215" y="360" text-anchor="middle" class="small">Embedding × √d_model</text>
  <rect x="90" y="432" width="250" height="78" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="215" y="465" text-anchor="middle" class="label">Sinusoidal position</text><text x="215" y="490" text-anchor="middle" class="small">add + dropout</text>
  <path d="M215 246V294" class="edge"/><path d="M215 382V426" class="edge"/>

  <rect x="405" y="230" width="385" height="310" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="597" y="270" text-anchor="middle" class="label">Encoder × N</text>
  <rect x="452" y="300" width="290" height="70" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="597" y="330" text-anchor="middle" class="small">Multi-Head Self-Attention</text><text x="597" y="352" text-anchor="middle" class="tiny">Q, K, V from encoder states</text>
  <rect x="452" y="386" width="290" height="52" class="box" fill="#fff" stroke="#94a3b8"/>
  <text x="597" y="418" text-anchor="middle" class="small">Residual + dropout + LayerNorm</text>
  <rect x="452" y="454" width="290" height="62" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="597" y="480" text-anchor="middle" class="small">Position-wise FFN</text><text x="597" y="502" text-anchor="middle" class="tiny">Linear → ReLU → dropout → Linear</text>
  <path d="M340 471H399" class="edge"/><path d="M597 370V380" class="edge"/><path d="M597 438V448" class="edge"/>

  <rect x="90" y="650" width="250" height="78" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="215" y="683" text-anchor="middle" class="label">Target input IDs</text><text x="215" y="708" text-anchor="middle" class="small">[B,T] · PAD + causal masks</text>
  <rect x="90" y="782" width="250" height="78" class="box" fill="#cffafe" stroke="#0891b2"/>
  <text x="215" y="815" text-anchor="middle" class="label">Target embedding</text><text x="215" y="840" text-anchor="middle" class="small">× √d_model + position</text>
  <path d="M215 728V776" class="edge"/>

  <rect x="865" y="568" width="420" height="300" class="box" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="1075" y="608" text-anchor="middle" class="label">Decoder × N</text>
  <rect x="915" y="636" width="320" height="59" class="box" fill="#faf5ff" stroke="#c084fc"/>
  <text x="1075" y="661" text-anchor="middle" class="small">Masked Multi-Head Self-Attention</text><text x="1075" y="682" text-anchor="middle" class="tiny">causal + target padding mask</text>
  <rect x="915" y="709" width="320" height="59" class="box" fill="#faf5ff" stroke="#c084fc"/>
  <text x="1075" y="734" text-anchor="middle" class="small">Encoder–Decoder Cross-Attention</text><text x="1075" y="755" text-anchor="middle" class="tiny">Q from decoder; K,V from memory</text>
  <rect x="915" y="782" width="320" height="62" class="box" fill="#faf5ff" stroke="#c084fc"/>
  <text x="1075" y="808" text-anchor="middle" class="small">Position-wise FFN</text><text x="1075" y="830" text-anchor="middle" class="tiny">each sublayer has residual + norm</text>
  <path d="M340 821H855V666H909" class="edge"/><path d="M1075 695V703" class="edge"/><path d="M1075 768V776" class="edge"/>

  <path d="M790 300H828V739H909" class="edge"/>
  <text x="838" y="526" class="tiny" transform="rotate(90 838 526)">encoder memory</text>

  <rect x="1360" y="660" width="190" height="90" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1455" y="696" text-anchor="middle" class="label">Linear generator</text><text x="1455" y="723" text-anchor="middle" class="small">d_model → target vocab</text>
  <rect x="1360" y="800" width="190" height="78" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="1455" y="833" text-anchor="middle" class="label">Logits</text><text x="1455" y="857" text-anchor="middle" class="small">[B,T,V]</text>
  <path d="M1285 821H1354" class="edge"/><path d="M1455 750V794" class="edge"/>

  <rect x="90" y="895" width="1120" height="46" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="650" y="924" class="small" text-anchor="middle">Inference helper: encode once, then greedy autoregressive decode with a growing causal mask (no KV cache).</text>
</svg>
