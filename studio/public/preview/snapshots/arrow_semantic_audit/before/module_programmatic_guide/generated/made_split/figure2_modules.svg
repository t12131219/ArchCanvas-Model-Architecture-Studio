<tspan x="847.0" dy="0">Bottom-to-top; independent outputs are parallel, never an implicit tensor chain</tspan>
<tspan x="847.0" dy="16.52">Colors denote roles; Parameter / buffer / ordinary state are recorded separately in IR</tspan>
<tspan x="847.0" dy="16.52">Fixed source symbols + explicit profile; library operators are call boundaries</tspan>
</text>
<text x="847.0" y="1168" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#344155">
<tspan x="847.0" dy="0">Reviewed static source + selected profile. Repeated groups are templates; shapes are not runtime observations.</tspan>
</text>
<text x="847.0" y="1198" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#344155">
<tspan x="847.0" dy="0">E### = source span; dashed = side / shape dependencies; fork/join roles are typed in IR; no implicit sum.</tspan>
</text>
<text x="847.0" y="1223" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#344155">
<tspan x="847.0" dy="0">Repeated colors encode operation roles. Shared weights and independent instances are recorded in semantic_ir.json.</tspan>
</text>
