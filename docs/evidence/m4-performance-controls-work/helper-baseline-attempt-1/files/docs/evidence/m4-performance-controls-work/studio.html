<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4 未修改 Studio 固定窗口对照</title>
<link rel="stylesheet" href="/__m4_controls/controller.css">
<body data-measurement-surface="studio">
<header class="controller">
  <div class="heading"><h1>M4 Studio 对照</h1><a href="/__m4_controls/control">转到顶层调度控制页</a><span>独立存储 · 不修改产品构建</span></div>
  <p>先设置模型、层级、相机与目标。开始后预热 2 秒，采集 20 秒，再 drain 2 秒；原生操作须在采集前 10 秒完成。</p>
  <div class="row"><label>会话标签<input id="label" aria-label="会话标签" value="studio-4-r1"></label><label>模式<select id="mode" aria-label="测量模式"><option value="raf-only">raf-only</option><option value="full">full</option></select></label><label>视口<select id="viewport-profile" aria-label="测量视口"><option value="576">1280 × 576</option><option value="720">1280 × 720</option></select></label><label>操作<select id="operation" aria-label="测量操作"><option value="idle">idle</option><option value="drag">drag</option><option value="pan">pan</option><option value="zoom">zoom</option><option value="toggle">toggle</option><option value="undo">undo</option><option value="redo">redo</option><option value="pin">pin</option></select></label><button id="start">开始固定窗口</button><button id="cancel" disabled>取消并保留本次</button></div>
  <div class="row"><label>目标 ID<input id="targets" aria-label="测量目标 ID" placeholder="实际节点 ID，逗号分隔"></label><output id="status" aria-live="polite">等待上下文与 Studio</output></div>
</header>
<iframe id="measured-surface" class="measured" src="/" title="未修改的正式 ArchCanvas Studio"></iframe>
<section class="receipt-panel"><label>完整原始收据<textarea id="receipt" aria-label="完整原始性能收据" readonly></textarea></label><p>所有产品输入均由普通原生交互执行；观察器不 dispatch 输入、不读私有状态、不写 CanvasDocument。</p></section>
<script type="module" src="/__m4_controls/controller.mjs"></script>
</body>
</html>
