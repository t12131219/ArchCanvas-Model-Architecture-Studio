<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4 固定窗口调度控制</title>
<link rel="stylesheet" href="/__m4_controls/controller.css">
<body data-measurement-surface="control">
<header class="controller">
  <div class="heading"><h1>M4 调度控制页</h1><a href="/__m4_controls/studio">转到未修改 Studio 对照</a><span>AI 工程诊断 · 不是呈现帧率</span></div>
  <p>开始后预热 2 秒，采集 20 秒，再等待 2 秒 delivery drain。原生点击须在采集前 10 秒完成，其余时间保持页面不动。</p>
  <div class="row"><label>会话标签<input id="label" aria-label="会话标签" value="control-r1"></label><label>模式<select id="mode" aria-label="测量模式"><option value="raf-only">raf-only</option><option value="full">full</option></select></label><label>视口<select id="viewport-profile" aria-label="测量视口"><option value="576">1280 × 576</option><option value="720">1280 × 720</option></select></label><label>操作<select id="operation" aria-label="测量操作"><option value="idle">idle</option><option value="click">click</option></select></label><button id="start">开始固定窗口</button><button id="cancel" disabled>取消并保留本次</button></div>
  <div class="row"><label>目标 ID<input id="targets" aria-label="测量目标 ID" value="control-target" readonly></label><output id="status" aria-live="polite">等待上下文</output></div>
</header>
<main id="measured-surface" class="measured control-surface" aria-label="完整可见测量区域">
  <div class="control-card"><p>最小原生输入目标，没有动画。</p><button id="control-target">原生点击目标 · 0</button><p>保留慢、缺失和无输入窗口。</p></div>
</main>
<section class="receipt-panel"><label>完整原始收据<textarea id="receipt" aria-label="完整原始性能收据" readonly></textarea></label><p>收据只在采集与 drain 结束后序列化；采集中不要读取大 DOM、收据或截图。</p></section>
<script type="module" src="/__m4_controls/controller.mjs"></script>
</body>
</html>
