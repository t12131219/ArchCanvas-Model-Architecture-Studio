<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4 简单页面调度对照</title>
<style>
body{margin:24px;background:#f7f9fc;color:#243448;font:15px system-ui,sans-serif}h1{font-size:24px}button{padding:12px 18px;margin:4px;border:1px solid #9aaabe;border-radius:7px;background:white;color:inherit}#target{display:block;width:280px;height:90px;background:#dcebf6;font-size:18px}textarea{display:block;width:calc(100% - 24px);height:190px;margin-top:16px;font:12px monospace}output{display:block;padding:12px 0}
</style>
<h1>M4 简单页面调度对照</h1>
<p>该页没有 React、SVG、产品遥测或模型。仅记录 rAF、原生 Event Timing、可信按钮输入和探针自身成本。不能认证 Studio 性能。</p>
<button id="start">开始 20 秒对照</button><button id="stop" disabled>结束并显示原始收据</button>
<output id="status" aria-live="polite">尚未开始</output>
<button id="target">可信点击目标 · 0</button>
<label>原始对照收据<textarea id="receipt" aria-label="原始对照收据" readonly></textarea></label>
<script type="module" src="/__m4/control.mjs"></script>
</html>
