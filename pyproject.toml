[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "archcanvas"
version = "0.1.0"
description = "Source-grounded model architecture analysis and review tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
  "libcst>=1.4,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
archcanvas = "archcanvas_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archcanvas_core*", "archcanvas_engine*", "archcanvas_python*"]

[tool.setuptools.package-data]
archcanvas_core = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
