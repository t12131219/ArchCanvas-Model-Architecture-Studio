name: Baseline CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: python -m pip install -e ".[dev,cross-framework]"
      - run: python -m ruff check src tests tools
      - run: python -m pytest
      - run: python -m compileall -q src tools tests
      - run: python tools/export_schemas.py --check
      - run: npm ci
        working-directory: studio
      - run: npm run build
        working-directory: studio
